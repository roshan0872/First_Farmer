{% extends "base.html" %}

{% block title %}{{ title }} &mdash; Admin{% endblock %}

{% block content %}
<div class="card" style="max-width: 540px; margin: 40px auto; text-align: center; border-top: 4px solid var(--error); padding: 32px 24px;">
  <div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>
  <h1 style="font-size: 22px; margin-bottom: 12px; color: var(--error);">{{ title }}</h1>
  
  <p style="font-size: 15px; margin-bottom: 24px; color: var(--primary-text);">
    Are you sure you want to permanently delete <strong>"{{ item_name }}"</strong>?
    This action is irreversible and will delete all dependent guides and records.
  </p>

  <form method="POST" style="display: flex; justify-content: center; gap: 16px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <a href="{{ back_url }}" class="btn btn-secondary">{{ t('btn_cancel') }}</a>
    <button type="submit" class="btn btn-danger">{{ t('btn_delete') }} Permanently</button>
  </form>
</div>
{% endblock %}
