{% extends "base.html" %}

{% block title %}{{ title }} &mdash; Admin{% endblock %}

{% block content %}
<nav class="breadcrumbs">
  <a href="{{ url_for('admin.index') }}">Admin Dashboard</a>
  <span>&rsaquo;</span>
  <a href="{{ url_for('admin.pests_list') }}">Pests &amp; Diseases</a>
  <span>&rsaquo;</span>
  <span>{{ title }}</span>
</nav>

<div class="card" style="max-width: 800px; margin: 0 auto;">
  <h1 style="font-size: 24px; margin-bottom: 20px;">{{ title }}</h1>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="grid grid-3">
      <div class="form-group">
        <label class="form-label">Host Crop *</label>
        <select name="crop_id" class="form-control" required>
          {% for c in crops %}
            <option value="{{ c.id }}" {{ 'selected' if pest and pest.crop_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label class="form-label">Pest / Disease Common Name *</label>
        <input type="text" name="name" value="{{ pest.name if pest else '' }}" class="form-control" required placeholder="e.g. Yellow Stem Borer (Scirpophaga incertulas)">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Category Type *</label>
      <select name="type" class="form-control" required>
        <option value="pest" {{ 'selected' if pest and pest.type == 'pest' }}>Insect / Animal Pest</option>
        <option value="disease" {{ 'selected' if pest and pest.type == 'disease' }}>Fungal / Bacterial / Viral Disease</option>
        <option value="other" {{ 'selected' if pest and pest.type == 'other' }}>Weed / Nematode / Other</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Diagnostic Visual Symptoms *</label>
      <textarea name="symptoms" class="form-control" rows="3" required placeholder="Describe leaf spots, wilting, borings, or discoloration...">{{ pest.symptoms if pest else '' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Contributing Weather &amp; Field Conditions *</label>
      <textarea name="contributing_conditions" class="form-control" rows="2" required placeholder="e.g. High humidity (>85%), temperatures 22-26C, waterlogging...">{{ pest.contributing_conditions if pest else '' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Preventive Agronomic Measures *</label>
      <textarea name="prevention" class="form-control" rows="3" required placeholder="Resistant varieties, bio-seed treatment, trap crops...">{{ pest.prevention if pest else '' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">IPM Management Protocol *</label>
      <textarea name="management" class="form-control" rows="3" required placeholder="Biological biocontrol, parasitoids, neem formulations, non-toxic barriers...">{{ pest.management if pest else '' }}</textarea>
    </div>

    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label">Source Reference</label>
        <input type="text" name="source_reference" value="{{ pest.source_reference if pest else '' }}" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Last Reviewed Date</label>
        <input type="text" name="last_reviewed_at" value="{{ pest.last_reviewed_at if pest else '2026-03-01' }}" class="form-control">
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 16px;">
      <button type="submit" class="btn btn-primary">Save Pest Record</button>
      <a href="{{ url_for('admin.pests_list') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
