<header class="app-header">
  <button type="button" class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle mobile menu" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="header-actions">
    <!-- Language Switcher -->
    <div class="lang-selector" aria-label="Language selection">
      <a href="{{ url_for('main.set_language', lang='en') }}" class="lang-btn {{ 'active' if current_lang == 'en' }}" title="English">EN</a>
      <a href="{{ url_for('main.set_language', lang='ta') }}" class="lang-btn {{ 'active' if current_lang == 'ta' }}" title="Tamil">தமிழ்</a>
      <a href="{{ url_for('main.set_language', lang='hi') }}" class="lang-btn {{ 'active' if current_lang == 'hi' }}" title="Hindi">हिन्दी</a>
    </div>

    <!-- User Profile or Auth Links -->
    {% if current_user %}
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="{{ url_for('profile.index') }}" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>{{ current_user.full_name.split(' ')[0] }}</span>
        </a>
      </div>
    {% else %}
      <div style="display: flex; gap: 8px;">
        <a href="{{ url_for('auth.login') }}" class="btn btn-secondary btn-sm">{{ t('nav_login') }}</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-sm">{{ t('nav_register') }}</a>
      </div>
    {% endif %}
  </div>
</header>
